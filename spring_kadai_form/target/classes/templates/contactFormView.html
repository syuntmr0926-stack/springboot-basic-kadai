<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせフォーム</title>
</head>
<body>

<h2>お問い合わせフォーム</h2>

<form th:action="@{/contact/confirm}" method="post" th:object="${contactForm}">

    <p>
        お名前<br>
        <input type="text" th:field="*{name}">
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    </p>

    <p>
        メールアドレス<br>
        <input type="text" th:field="*{email}">
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span>
    </p>

    <p>
        お問い合わせ内容<br>
        <textarea cols="30" rows="10" th:field="*{message}"></textarea>
        <span th:if="${#fields.hasErrors('message')}" th:errors="*{message}" style="color:red"></span>
    </p>

    <button type="submit">送信</button>

</form>

</body>
</html>
